# Living Azeroth realm settings.
#
# `living-azeroth setup` copies this file to <realm folder>/realm.conf. Edit that copy,
# then run `living-azeroth restart`. Database connections, file paths and secrets are
# filled in by the tools and cannot be set here.
#
# Each section below adds or overrides keys in one server config file. Any key from
# that file's .conf.dist can be used; the full list with descriptions is in:
#   [worldserver]   src/server/apps/worldserver/worldserver.conf.dist
#   [authserver]    src/server/apps/authserver/authserver.conf.dist
#   [playerbots]    modules/mod-playerbots/conf/playerbots.conf.dist
#   [characters]    modules/mod-living-characters/conf/playerbots_characters.conf.dist
#   [auctionhouse]  modules/mod-ah-bot-plus/conf/mod_ahbot.conf.dist
#   [progression]   modules/mod-progression-system/conf/progression_system.conf.dist

[realm]
# Shown in the client's realm list.
name = Living Azeroth
# Address players connect to. 127.0.0.1 for this computer only; this computer's
# network address to let others on your network play.
address = 127.0.0.1
# Which network interface the ports listen on (127.0.0.1 = this computer only, 0.0.0.0 = all).
bind = 127.0.0.1
auth_port = 3724
world_port = 8085
# Spending ceiling in US dollars for the character system's model calls. Used only when
# the realm's budget is first created; it can never be raised or reset afterwards.
budget_dollars = 5
# Spend from another realm's budget instead (that realm's folder, e.g. ../main), so both
# realms share one spending limit. That realm's database is started when this one starts.
# shared_budget =
# Parallel compile jobs. Lower it if the computer runs out of memory while building.
build_jobs = 4

[worldserver]
Expansion = 2
MaxPlayerLevel = 80
Rate.XP.Kill = 2
Rate.XP.Quest = 2
Rate.XP.Quest.DF = 2
Rate.XP.Explore = 2
Rate.XP.Pet = 2
Warden.Enabled = 0
GM.LoginState = 0
GM.Visible = 1
GM.Chat = 0
GM.AllowInvite = 1
GM.AllowFriend = 1
Motd = "Welcome to Living Azeroth"

[authserver]

[playerbots]
# Orders start with "@"; plain chat goes to the character system as conversation.
AiPlayerbot.CommandPrefix = "@"
AiPlayerbot.DialogueActions = 1
AiPlayerbot.EnableAutoTradeOnItemMention = 0
AiPlayerbot.RandomBotAccountCount = 0
AiPlayerbot.AddClassAccountPoolSize = 0
AiPlayerbot.MinRandomBots = 100
AiPlayerbot.MaxRandomBots = 100
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotMaxLevel = 80
AiPlayerbot.SyncLevelWithPlayers = 1
AiPlayerbot.RandomBotConcentrateInPlayerZone = 1
AiPlayerbot.DisabledWithoutRealPlayer = 1
AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 10
AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 60
AiPlayerbot.RandomBotAutoJoinBG = 0
AiPlayerbot.FreeMethodLoot = 0
# Persistent population: gradual arrivals, familiar faces, regional density.
AiPlayerbot.RandomBotAutologin = 1
AiPlayerbot.Population.Enabled = 1
AiPlayerbot.Population.OnlineTarget = 500
AiPlayerbot.Population.ReserveTarget = 2000
AiPlayerbot.Population.OfflineOnline = 0
AiPlayerbot.Population.RegionTarget = 40
# City bots visit several NPCs on errands instead of hopping every few seconds.
AiPlayerbot.RpgCityErrands = 1

[characters]
# The character system runs when a model key is present (see docs/configuration.md).
# The original PBC runtime (PBC.Enable) is off by default; keep it off.
PBC.CharacterSystem.ContextTokens = 32000
PBC.CharacterSystem.MemoryInactiveSeconds = 300
PBC.CharacterSystem.MaxTurns = 4
PBC.CharacterSystem.SpacingMs = 2000
PBC.CharacterSystem.ReadingWordsPerMinute = 150
PBC.CharacterSystem.AmbientEnabled = 1
PBC.CharacterSystem.AmbientMinMinutes = 20
PBC.CharacterSystem.AmbientMaxMinutes = 40
# Prepared knowledge for Northshire (empty to switch off).
PBC.CharacterSystem.KnowledgePath = "/source/modules/mod-living-characters/knowledge/northshire.json"
PBC.CharacterSystem.KnowledgeEra = "wotlk"

[auctionhouse]
# The auction house bot is installed but switched off.
AuctionHouseBot.EnableSeller = false
AuctionHouseBot.Buyer.Enabled = false

[progression]
# Progression phases are all off, so all Wrath of the Lich King content is open.
